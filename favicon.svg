<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4936a"/>
      <stop offset="100%" style="stop-color:#e8c98a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a100a"/>
      <stop offset="100%" style="stop-color:#2e1e0f"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#sky)" rx="20"/>
  
  <!-- Sun -->
  <circle cx="50" cy="40" r="18" fill="url(#sand)" opacity="0.9"/>
  
  <!-- Dune 1 -->
  <path d="M0,70 Q25,50 50,70 Q75,90 100,70 L100,100 L0,100 Z" fill="#8b5e3c" opacity="0.8"/>
  
  <!-- Dune 2 -->
  <path d="M0,80 Q30,65 60,80 Q80,95 100,80 L100,100 L0,100 Z" fill="#c4935a" opacity="0.9"/>
  
  <!-- Dune 3 (foreground) -->
  <path d="M0,90 Q40,75 70,90 Q90,100 100,90 L100,100 L0,100 Z" fill="#e8c98a"/>
  
  <!-- Wind line -->
  <path d="M15,55 Q30,50 45,55" stroke="#e8c98a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M55,60 Q65,56 80,60" stroke="#e8c98a" stroke-width="1.5" fill="none" opacity="0.4"/>
  
  <!-- Tiny sand grain dots -->
  <circle cx="30" cy="85" r="1.5" fill="#f5e9d0" opacity="0.5"/>
  <circle cx="65" cy="88" r="1" fill="#f5e9d0" opacity="0.4"/>
  <circle cx="45" cy="92" r="1.5" fill="#f5e9d0" opacity="0.6"/>
</svg>