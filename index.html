<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Staging Area</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .template-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .template-card:hover {
            transform: translateY(-5px);
        }
        
        .template-preview {
            background: #f5f5f5;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ddd;
        }
        
        .template-info {
            padding: 20px;
        }
        
        .template-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .template-desc {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #764ba2;
        }
        
        .status {
            display: inline-block;
            background: #4CAF50;
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 3px;
            margin-left: 10px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Template Staging Area</h1>
        <p class="subtitle">Develop, test, and refine templates before deploying to production</p>
        
        <div class="templates-grid" id="templates-grid">
            <!-- Templates will be listed here -->
        </div>
    </div>

    <script>
        // Auto-discover templates from your folders
        const templates = [
            {
                name: "Business Template",
                description: "Corporate layout with hero section, services, and contact form",
                path: "/templates/template-1-business/index.html",
                status: "In Development"
            },
            {
                name: "Portfolio Template",
                description: "Creative portfolio with grid gallery and about section",
                path: "/templates/template-2-portfolio/index.html",
                status: "Ready for Review"
            },
            {
                name: "Blog Template",
                description: "Clean blog layout with cards and sidebar",
                path: "/templates/template-3-blog/index.html",
                status: "Draft"
            }
        ];
        
        const grid = document.getElementById('templates-grid');
        
        templates.forEach(template => {
            const card = document.createElement('div');
            card.className = 'template-card';
            card.innerHTML = `
                <div class="template-preview">
                    <div style="text-align: center; color: #999;">
                        🖼️<br>
                        Preview Image
                    </div>
                </div>
                <div class="template-info">
                    <div class="template-name">
                        ${template.name}
                        <span class="status">${template.status}</span>
                    </div>
                    <div class="template-desc">${template.description}</div>
                    <a href="${template.path}" class="btn" target="_blank">Edit Template →</a>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
