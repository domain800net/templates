<style>
:root{
  --sand-deep:#1a100a;--c-accent:#d4936a;--c-accent2:#f0b97a;
  --c-text:#f5e9d0;--c-muted:rgba(245,233,208,0.5);
  --c-border:rgba(212,147,106,0.15);--c-border2:rgba(212,147,106,0.28);
  --glass-bg:rgba(26,16,10,0.3);--glass-bg2:rgba(20,12,6,0.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--sand-deep);color:var(--c-text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
#desert-canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
#page{position:relative;z-index:1}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#1a100a}::-webkit-scrollbar-thumb{background:#8b5e3c;border-radius:3px}
.font-display{font-family:'Syne',sans-serif}
.glass{background:var(--glass-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--c-border)}
.glass-strong{background:var(--glass-bg2);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--c-border2)}
.grad-text{background:linear-gradient(135deg,#f5e9d0 0%,#e8c98a 45%,#d4936a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-text-sm{background:linear-gradient(135deg,#e8c98a,#d4936a);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn-primary{background:linear-gradient(135deg,rgba(180,110,55,0.9),rgba(210,130,70,0.95));color:#f5e9d0;border:1px solid rgba(230,160,80,0.4);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-primary:hover{background:linear-gradient(135deg,rgba(210,130,70,1),rgba(240,185,90,0.95));transform:translateY(-2px);box-shadow:0 10px 32px rgba(180,110,55,.45)}
.btn-ghost{background:rgba(245,233,208,0.06);border:1px solid var(--c-border2);color:var(--c-text);cursor:pointer;transition:all .2s}
.btn-ghost:hover{background:rgba(245,233,208,0.12);border-color:rgba(212,147,106,.6)}

/* 3D Card Styles */
.template-card {
  background: rgba(20,12,6,0.35);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid rgba(212,147,106,.18);
  border-radius: 22px;
  overflow: hidden;
  transition: all 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  transform-style: preserve-3d;
  transform: translateZ(0) rotateX(0deg) rotateY(0deg);
  cursor: pointer;
}
.template-card:hover {
  transform: translateY(-8px) rotateX(2deg) rotateY(4deg) scale(1.02);
  border-color: rgba(212,147,106,.5);
  box-shadow: 0 28px 48px rgba(0,0,0,.45);
}
.template-card:hover .card-icon {
  transform: scale(1.05);
}

/* Cart Drawer */
.cart-drawer {
  position: fixed;
  top: 0;
  right: -420px;
  width: 400px;
  max-width: 90vw;
  height: 100vh;
  background: rgba(20,12,6,0.95);
  backdrop-filter: blur(32px);
  border-left: 1px solid var(--c-border2);
  z-index: 200;
  transition: right 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  display: flex;
  flex-direction: column;
}
.cart-drawer.open { right: 0; }
.cart-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 199;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
}
.cart-overlay.open { opacity: 1; visibility: visible; }

/* Modal */
.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  max-width: 550px;
  width: 90%;
  background: rgba(20,12,6,0.98);
  backdrop-filter: blur(40px);
  border: 1px solid var(--c-border2);
  border-radius: 28px;
  z-index: 300;
  opacity: 0;
  visibility: hidden;
  transition: all 0.25s;
}
.modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(20,12,6,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--c-accent2);
  border-radius: 60px;
  padding: 12px 24px;
  z-index: 400;
  opacity: 0;
  transition: all 0.3s;
  font-size: 14px;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Filter chips */
.filter-chip {
  background: rgba(245,233,208,0.06);
  border: 1px solid var(--c-border);
  border-radius: 40px;
  padding: 8px 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-chip.active {
  background: rgba(212,147,106,0.25);
  border-color: var(--c-accent2);
  color: var(--c-accent2);
}
.filter-chip:hover {
  background: rgba(212,147,106,0.15);
}

/* Rating stars */
.star-filled { color: #f0b97a; }
.star-empty { color: rgba(245,233,208,0.25); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-animate { animation: fadeUp 0.5s ease forwards; }
</style>
</head>
<body>
<canvas id="desert-canvas"></canvas>
<div id="ripple-layer" style="position:fixed;inset:0;z-index:9998;pointer-events:none"></div>
<div id="page">

<!-- Navbar with Cart -->
<nav class="glass-strong" style="position:sticky;top:0;z-index:100;border-bottom:1px solid var(--c-border)">
  <div style="max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <div style="width:32px;height:32px;background:linear-gradient(135deg,rgba(180,110,55,.9),rgba(212,147,106,.9));border-radius:9px;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h8" stroke="#f5e9d0" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>
      <span class="font-display" style="font-weight:800;font-size:1.2rem;letter-spacing:-.5px;color:var(--c-text)">TemplateForge</span>
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:12px;background:rgba(255,255,255,0.05);padding:5px 12px;border-radius:40px;">
        <i class="fas fa-user"></i> Alex
      </div>
      <button onclick="toggleCart()" class="btn-ghost" style="padding:8px 16px;border-radius:12px;position:relative">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count" style="position:absolute;top:-6px;right:-8px;background:#d4936a;color:#1a100a;font-size:10px;font-weight:bold;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center">0</span>
      </button>
    </div>
  </div>
  <div style="max-width:1400px;margin:0 auto;padding:8px 24px;border-top:1px solid var(--c-border)">
    <div style="font-size:12px;color:var(--c-muted)">
      <i class="fas fa-folder-open"></i> TemplateForge / <span class="grad-text-sm">Store</span>
    </div>
  </div>
</nav>

<!-- Main Store Section -->
<main style="max-width:1400px;margin:0 auto;padding:40px 24px 80px">
  <!-- Header -->
  <div style="text-align:center;margin-bottom:48px">
    <div style="font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--c-accent);margin-bottom:12px;font-weight:600">The Marketplace</div>
    <h1 class="font-display grad-text" style="font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.03em">Premium Templates</h1>
    <p style="color:var(--c-muted);margin-top:12px">60+ production-ready templates · Lifetime updates · Commercial license</p>
  </div>

  <!-- Filters + Search + Sort Row -->
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;margin-bottom:40px">
    <div style="display:flex;flex-wrap:wrap;gap:10px" id="filter-container">
      <button data-category="all" class="filter-chip active">All</button>
      <button data-category="business" class="filter-chip">Business</button>
      <button data-category="portfolio" class="filter-chip">Portfolio</button>
      <button data-category="ecommerce" class="filter-chip">E-commerce</button>
      <button data-category="saas" class="filter-chip">SaaS</button>
      <button data-category="blog" class="filter-chip">Blog</button>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div class="glass" style="padding:6px 16px;border-radius:40px;display:flex;align-items:center;gap:8px">
        <i class="fas fa-search" style="color:var(--c-muted);font-size:13px"></i>
        <input type="text" id="search-input" placeholder="Search templates..." style="background:transparent;border:none;color:var(--c-text);outline:none;font-size:13px;width:160px">
      </div>
      <select id="sort-select" class="glass" style="padding:8px 16px;border-radius:40px;background:rgba(20,12,6,0.5);border:1px solid var(--c-border);color:var(--c-text);font-size:13px;cursor:pointer">
        <option value="popular">🔥 Popular</option>
        <option value="newest">✨ Newest</option>
        <option value="price-low">💰 Price: Low to High</option>
        <option value="price-high">💰 Price: High to Low</option>
      </select>
    </div>
  </div>

  <!-- Templates Grid -->
  <div id="templates-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px">
    <!-- JS will populate -->
  </div>
</main>

<!-- Cart Drawer -->
<div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>
<div id="cart-drawer" class="cart-drawer">
  <div style="padding:24px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;align-items:center">
    <h3 class="font-display" style="font-weight:700"><i class="fas fa-shopping-bag"></i> Your Cart</h3>
    <button onclick="toggleCart()" class="btn-ghost" style="padding:6px 12px;border-radius:50%"><i class="fas fa-times"></i></button>
  </div>
  <div id="cart-items" style="flex:1;overflow-y:auto;padding:20px"></div>
  <div style="padding:20px;border-top:1px solid var(--c-border)">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px">
      <span>Subtotal</span>
      <span class="font-display" id="cart-total" style="font-weight:800;font-size:1.2rem">$0</span>
    </div>
    <button onclick="checkout()" class="btn-primary" style="width:100%;padding:14px;border-radius:14px;font-weight:700">Proceed to Checkout →</button>
    <p style="font-size:11px;color:var(--c-muted);text-align:center;margin-top:12px">Lifetime access · Instant download</p>
  </div>
</div>

<!-- Preview Modal -->
<div id="modal" class="modal">
  <div style="padding:28px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 id="modal-title" class="font-display" style="font-weight:700;font-size:1.5rem"></h3>
      <button onclick="closeModal()" class="btn-ghost" style="padding:6px 12px;border-radius:50%"><i class="fas fa-times"></i></button>
    </div>
    <div id="modal-body"></div>
    <div style="margin-top:24px;display:flex;gap:12px">
      <button id="modal-buy-btn" class="btn-primary" style="flex:1;padding:12px">Buy Now</button>
      <button onclick="closeModal()" class="btn-ghost" style="padding:12px 24px">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// Template Data
const templatesData = [
  { id: 1, name: "Nova Business Suite", category: "business", price: 49, rating: 4.9, reviews: 312, popular: true, icon: "🏢", desc: "High-conversion corporate layout with hero sections, service grids, and smart contact flow.", badge: "Best Seller" },
  { id: 2, name: "Aether Portfolio", category: "portfolio", price: 59, rating: 4.8, reviews: 247, popular: true, icon: "🎨", desc: "Creative 3D gallery, immersive about section, and micro-interactions for creators.", badge: "Trending" },
  { id: 3, name: "Mindful Blog", category: "blog", price: 39, rating: 4.7, reviews: 189, popular: false, icon: "📝", desc: "Clean card-based blog layout, sidebar widgets, and typography-first design.", badge: null },
  { id: 4, name: "Lumina Shop", category: "ecommerce", price: 79, rating: 4.9, reviews: 421, popular: true, icon: "🛍️", desc: "Modern shop template with product cards, cart preview, and seamless checkout.", badge: "Best Seller" },
  { id: 5, name: "Zen SaaS Landing", category: "saas", price: 69, rating: 4.9, reviews: 356, popular: true, icon: "⚡", desc: "Bold SaaS landing with pricing tables, testimonials, and smooth CTA modals.", badge: "Trending" },
  { id: 6, name: "Studio Agency", category: "portfolio", price: 89, rating: 5.0, reviews: 178, popular: false, icon: "✨", desc: "Agency showcase with animated counters, marquee, and full-bleed imagery.", badge: "New" },
  { id: 7, name: "Executive Suite", category: "business", price: 99, rating: 4.8, reviews: 94, popular: false, icon: "🏦", desc: "Premium corporate template with dashboard and analytics components.", badge: "Premium" },
  { id: 8, name: "Foodie Blog", category: "blog", price: 44, rating: 4.6, reviews: 132, popular: false, icon: "🍽️", desc: "Recipe blog with masonry grid and beautiful typography.", badge: null },
  { id: 9, name: "Fashion Store", category: "ecommerce", price: 89, rating: 4.9, reviews: 203, popular: true, icon: "👗", desc: "Elegant fashion store with lookbook and quick view modals.", badge: "Best Seller" }
];

let cart = JSON.parse(localStorage.getItem('templateCart') || '[]');
let currentFilter = 'all';
let currentSearch = '';
let currentSort = 'popular';

function saveCart() { localStorage.setItem('templateCart', JSON.stringify(cart)); updateCartUI(); }

function updateCartUI() {
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  document.getElementById('cart-count').innerText = count;
  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  document.getElementById('cart-total').innerHTML = `$${total}`;
  renderCartItems();
}

function renderCartItems() {
  const container = document.getElementById('cart-items');
  if (!container) return;
  if (cart.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--c-muted)"><i class="fas fa-shopping-bag" style="font-size:40px;margin-bottom:12px;display:block"></i>Your cart is empty</div>';
    return;
  }
  container.innerHTML = cart.map(item => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--c-border)">
      <div><div style="font-weight:600">${item.name}</div><div style="font-size:12px;color:var(--c-muted)">$${item.price}</div></div>
      <div style="display:flex;align-items:center;gap:12px"><button onclick="updateQty(${item.id}, ${item.quantity - 1})" style="background:rgba(255,255,255,0.1);border:none;padding:4px 10px;border-radius:8px;cursor:pointer">-</button><span>${item.quantity}</span><button onclick="updateQty(${item.id}, ${item.quantity + 1})" style="background:rgba(255,255,255,0.1);border:none;padding:4px 10px;border-radius:8px;cursor:pointer">+</button><button onclick="removeFromCart(${item.id})" style="color:#d4936a;background:none;border:none;cursor:pointer"><i class="fas fa-trash"></i></button></div>
    </div>
  `).join('');
}

function updateQty(id, newQty) {
  if (newQty <= 0) { removeFromCart(id); return; }
  const item = cart.find(i => i.id === id);
  if (item) item.quantity = newQty;
  saveCart();
}

function addToCart(template) {
  const existing = cart.find(i => i.id === template.id);
  if (existing) { existing.quantity++; }
  else { cart.push({ ...template, quantity: 1 }); }
  saveCart();
  showToast(`✨ ${template.name} added to cart`);
  animateRipple();
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
  showToast(`Removed from cart`);
}

function checkout() {
  if (cart.length === 0) { showToast('Your cart is empty'); return; }
  showToast(`🎉 Thank you! Total: $${cart.reduce((s,i)=>s+(i.price*i.quantity),0)} (demo)`);
  cart = [];
  saveCart();
  toggleCart();
}

function toggleCart() {
  document.getElementById('cart-drawer').classList.toggle('open');
  document.getElementById('cart-overlay').classList.toggle('open');
}

let currentPreviewTemplate = null;
function openPreview(template) {
  currentPreviewTemplate = template;
  document.getElementById('modal-title').innerText = template.name;
  document.getElementById('modal-body').innerHTML = `
    <div style="font-size:3rem;text-align:center;margin-bottom:16px">${template.icon}</div>
    <p style="margin-bottom:12px">${template.desc}</p>
    <div style="display:flex;gap:12px;margin-bottom:12px"><span class="glass" style="padding:4px 12px;border-radius:40px">${template.category}</span><span class="glass" style="padding:4px 12px;border-radius:40px">⭐ ${template.rating} (${template.reviews} reviews)</span></div>
    <div class="font-display" style="font-size:1.8rem;font-weight:800;color:var(--c-accent2)">$${template.price}</div>
    ${template.badge ? `<div style="margin-top:12px;background:rgba(212,147,106,0.2);display:inline-block;padding:4px 12px;border-radius:40px;font-size:12px">🏷️ ${template.badge}</div>` : ''}
  `;
  document.getElementById('modal-buy-btn').onclick = () => { addToCart(template); closeModal(); };
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function animateRipple() {
  const layer = document.getElementById('ripple-layer');
  const rip = document.createElement('div');
  rip.className = 'wind-ripple';
  rip.style.cssText = `left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);position:absolute;border-radius:50%;border:2px solid rgba(212,147,106,.7);animation:windRipple 0.8s ease-out forwards`;
  layer.appendChild(rip);
  setTimeout(() => { try { layer.removeChild(rip) } catch(e){} }, 900);
}

function renderTemplates() {
  let filtered = templatesData.filter(t => {
    if (currentFilter !== 'all' && t.category !== currentFilter) return false;
    if (currentSearch && !t.name.toLowerCase().includes(currentSearch.toLowerCase()) && !t.desc.toLowerCase().includes(currentSearch.toLowerCase())) return false;
    return true;
  });
  if (currentSort === 'popular') filtered.sort((a,b) => (b.popular?1:0) - (a.popular?1:0) || b.rating - a.rating);
  else if (currentSort === 'newest') filtered.sort((a,b) => (b.badge === 'New' ? 1 : 0) - (a.badge === 'New' ? 1 : 0));
  else if (currentSort === 'price-low') filtered.sort((a,b) => a.price - b.price);
  else if (currentSort === 'price-high') filtered.sort((a,b) => b.price - a.price);
  
  const grid = document.getElementById('templates-grid');
  grid.innerHTML = filtered.map((t, idx) => `
    <div class="template-card card-animate" style="animation-delay:${idx * 0.03}s">
      <div style="height:160px;background:linear-gradient(135deg,rgba(26,16,10,.3),rgba(30,20,12,.5));display:flex;align-items:center;justify-content:center;position:relative">
        <div class="card-icon" style="font-size:3.5rem;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));transition:transform 0.3s">${t.icon}</div>
        ${t.badge ? `<span style="position:absolute;top:12px;right:12px;background:linear-gradient(135deg,rgba(180,80,30,.85),rgba(220,60,40,.8));color:#fde8d0;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.5px;">${t.badge}</span>` : ''}
      </div>
      <div style="padding:18px 20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div class="font-display" style="font-weight:700;font-size:1rem">${t.name}</div>
          <div class="font-display grad-text-sm" style="font-weight:800;font-size:1.1rem">$${t.price}</div>
        </div>
        <div style="font-size:11px;color:var(--c-muted);margin-bottom:8px">
          ${t.category} · ${'★'.repeat(Math.floor(t.rating))}${t.rating % 1 ? '½' : ''} (${t.reviews} reviews)
        </div>
        <p style="font-size:12px;color:rgba(245,233,208,.5);line-height:1.5;margin-bottom:16px">${t.desc.substring(0, 85)}${t.desc.length > 85 ? '...' : ''}</p>
        <div style="display:flex;gap:10px">
          <button onclick="openPreview(${JSON.stringify(t).replace(/"/g, '&quot;')})" class="btn-ghost" style="padding:8px 16px;border-radius:12px;font-size:12px;flex:1"><i class="fas fa-eye"></i> Preview</button>
          <button onclick="addToCart(${JSON.stringify(t).replace(/"/g, '&quot;')})" class="btn-primary" style="padding:8px 16px;border-radius:12px;font-size:12px;flex:1"><i class="fas fa-cart-plus"></i> Buy</button>
        </div>
      </div>
    </div>
  `).join('');
}

// Event Listeners
document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.category;
    renderTemplates();
  });
});
document.getElementById('search-input').addEventListener('input', e => { currentSearch = e.target.value; renderTemplates(); });
document.getElementById('sort-select').addEventListener('change', e => { currentSort = e.target.value; renderTemplates(); });

// Desert Canvas (from original)
const canvas = document.getElementById('desert-canvas');
const ctx = canvas.getContext('2d');
let W, H, mouseX = 400, mouseY = 300, clickBursts = [], windTime = 0;
const SAND_COLORS = ['rgba(26,16,8,1)','rgba(40,24,12,1)','rgba(72,42,20,1)','rgba(110,65,28,1)','rgba(160,100,45,1)','rgba(196,147,90,1)','rgba(232,201,138,1)'];
class DuneLayer {
  constructor(yB, amp, freq, spd, ci, al) { this.yBase = yB; this.amplitude = amp; this.freq = freq; this.speed = spd; this.colorIndex = ci; this.alpha = al; this.offset = Math.random() * 1000; }
  getY(x, t) { return this.yBase * H + Math.sin((x / W) * this.freq * Math.PI + this.offset + t * this.speed) * this.amplitude * H + Math.sin((x / W) * this.freq * 1.7 * Math.PI + this.offset * 1.3 + t * this.speed * .6) * this.amplitude * H * .4; }
  draw(t) {
    const c = SAND_COLORS[this.colorIndex], rgb = c.replace('rgba(', '').replace(',1)', '');
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) ctx.lineTo(x, this.getY(x, t));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = `rgba(${rgb},${this.alpha})`; ctx.fill();
  }
}
let dunes = [];
function resizeCanvas() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; dunes = [new DuneLayer(1.05, .04, 1.2, .018, 0, 1), new DuneLayer(.92, .055, 1.8, .022, 1, 1), new DuneLayer(.82, .065, 2.1, .026, 2, .9), new DuneLayer(.72, .07, 2.6, .031, 3, .88), new DuneLayer(.6, .075, 3, .036, 4, .82), new DuneLayer(.48, .08, 3.5, .04, 5, .72), new DuneLayer(.35, .085, 4.2, .048, 6, .45)]; }
function drawSky() { const g = ctx.createLinearGradient(0, 0, 0, H * .55); g.addColorStop(0, '#0d0703'); g.addColorStop(.4, '#1a0f06'); g.addColorStop(.8, '#2e1808'); g.addColorStop(1, '#3d2010'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function animateCanvas() { requestAnimationFrame(animateCanvas); windTime += .016; ctx.clearRect(0, 0, W, H); drawSky(); dunes.forEach(d => d.draw(windTime)); }
resizeCanvas(); window.addEventListener('resize', resizeCanvas); animateCanvas();

// Initial render
renderTemplates();
updateCartUI();
</script>
</body>
